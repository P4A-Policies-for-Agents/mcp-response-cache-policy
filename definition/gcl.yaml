---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: MCP Response Cache
    description: >-
      Caches side-effect-free MCP responses (discovery */list and allowlisted
      read-only tools/call) at the gateway, so repeated agent calls are served
      locally instead of re-hitting the upstream. Cuts latency, load, and cost.
      PDK-only, no Redis.
    category: MCP
    metadata/interfaceScope: api
    metadata/capabilities/assetTypes: mcp
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    discovery:
      type: object
      title: Discovery Caching
      description: >-
        Controls caching of MCP discovery methods (tools/list, resources/list,
        prompts/list). These are the highest-value entries — agents re-issue
        them on every session bootstrap.
      properties:
        cacheable:
          type: boolean
          title: Cache Discovery
          description: >-
            Cache tools/list, resources/list, and prompts/list responses.
          default: true
        ttl:
          type: integer
          title: Discovery TTL (seconds)
          description: >-
            Time-to-live for cached discovery entries, in seconds. Set to 0 to
            disable discovery caching regardless of the Cache Discovery flag.
          default: 60
          minimum: 0
        methods:
          type: array
          title: Discovery Methods
          uniqueItems: true
          description: >-
            Which discovery methods to cache. Leave empty to cache all three
            (tools/list, resources/list, prompts/list) — the default. Select a
            subset to cache only those; a discovery method not listed is passed
            through (never cached).
          items:
            type: string
            enum:
              - tools/list
              - resources/list
              - prompts/list
    tools:
      type: array
      title: Cacheable Tools
      uniqueItems: true
      description: >-
        Per-tool cache configuration. A tool NOT listed here is passed through
        (never cached) — caching is opt-in per tool. A listed tool is still
        never cached if it is observed as destructive (destructiveHint) or
        lacking readOnlyHint in a tools/list response.
      default: []
      items:
        type: object
        properties:
          name:
            type: string
            title: Tool Name
            description: >-
              Exact MCP tool name (params.name) this entry configures.
          cacheable:
            type: boolean
            title: Cacheable
            description: Enable caching for this tool's read-only tools/call responses.
            default: false
          ttl:
            type: integer
            title: TTL (seconds)
            description: >-
              Maximum lifetime of a cached entry for this tool, in seconds.
            minimum: 1
          scope:
            type: string
            title: Cache Scope
            description: >-
              shared = key on tool name + canonical arguments (one entry shared
              across all callers). partitioned = also partition the key by the
              top-level Partition strategy (per-caller or per-tenant isolation);
              if the strategy resolves to nothing the call is not cached.
            enum:
              - shared
              - partitioned
            default: shared
        required:
          - name
          - ttl
    partition:
      type: object
      title: Partition Strategy
      description: >-
        How to partition the cache key for tools with scope = partitioned. All
        partitioned tools share this one strategy; to partition different tools
        differently, apply the policy a second time. Ignored by shared-scope
        tools and by discovery caching.
      properties:
        mode:
          type: string
          title: Partition Mode
          description: >-
            presets = partition by the no-code Partition By list below.
            dataweave = partition by the Partition Key DataWeave expression
            below. The unused field is ignored.
          enum:
            - presets
            - dataweave
          default: presets
        partitionBy:
          type: array
          title: Partition By
          description: >-
            Used when mode = presets. Each entry is one partition source:
            "principal" (the x-forwarded-user header), "session" (the
            mcp-session-id header), or "header:<Name>" for any request header
            (e.g. "header:x-tenant-id"). Sources are combined into the key; if
            NONE of them resolve to a value on a request, that request is not
            cached (never cache under a weak key).
          items:
            type: string
          default:
            - principal
        partitionKey:
          type: string
          format: dataweave
          title: Partition Key (DataWeave)
          description: >-
            Used when mode = dataweave. A DataWeave expression evaluated per
            request against request attributes (headers); its value partitions
            the cache key. Example: #[attributes.headers['x-tenant-id']]. If it
            resolves to null/empty, the request is not cached.
          default: "#[null]"
          bindings:
            attributes: true
    maxEntries:
      type: integer
      title: Max Entries
      description: >-
        Cache size cap. In local (non-distributed) mode this is a hard LRU
        eviction bound. In distributed mode the namespace TTL is the operative
        bound and this acts as a soft, best-effort cap.
      default: 1000
      minimum: 1
    distributed:
      type: boolean
      title: Distributed
      description: >-
        Share the cache across gateway replicas using the gossip-replicated
        DataStorage backend (no Redis). When false (default), each replica keeps
        its own in-memory cache with hard LRU eviction.
      default: false
  required:
    - discovery
