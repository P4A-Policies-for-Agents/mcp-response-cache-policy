---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: ApiInstance
metadata:
  name: ingress-mcp
spec:
  address: http://0.0.0.0:8081
  services:
    upstream:
      address: http://backend
      routes:
        - config:
            destinationPath: /
  policies:
    - policyRef:
        name: mcp-response-cache-policy-flex-v1-0 # Overridden during 'make run' execution
        namespace: default
      config:
        # Cache discovery methods for 60s — the highest-value entries agents
        # re-issue on bootstrap. Omit `methods` to cache all three (tools/list,
        # resources/list, prompts/list); list a subset to cache only those.
        discovery:
          cacheable: true
          ttl: 60
        # Opt in per tool. A read-only lookup shared across all callers:
        tools:
          - name: search
            cacheable: true
            ttl: 120
            scope: shared
          # A per-caller result — partitioned by the strategy below:
          - name: get_my_profile
            cacheable: true
            ttl: 30
            scope: partitioned
        # Partition strategy shared by every partitioned-scope tool. Presets
        # mode keys the entry by the authenticated principal (x-forwarded-user);
        # if no source resolves, the request is not cached. To partition by an
        # arbitrary header use "header:x-tenant-id"; for a DataWeave expression
        # set mode: dataweave and supply partitionKey.
        partition:
          mode: presets
          partitionBy:
            - principal
        # Local in-memory cache with hard LRU eviction at 1000 entries.
        maxEntries: 1000
        # Single-replica cache. Set true to share across replicas via gossip.
        distributed: false
        # Smoke testing tips (scaffold currently passes through — full cache
        # lifecycle lands in the implementation phase):
        # 1. POST a JSON-RPC body to http://localhost:8081/post
        #    {"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}
        # 2. Repeated identical cacheable calls should return x-mcp-cache: hit.
        # 3. Cache-Control: no-cache forces x-mcp-cache: bypass.
